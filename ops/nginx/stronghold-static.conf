# Include inside BOTH HTTPS server blocks. Dynamic routes, /data.js,
# /packs/, /media/ and WebSocket /ws remain with the Node route handler.
# Regex order matters: private files must be rejected before the mounts.
location ~ /\. { return 404; }
location ~* ^/sim/(?:.*/)?nodedata\.js$ { return 404; }

location ~ ^/(?:js|css|assets|vendor|fonts|icons|client)/ {
    root /opt/sp2/public;
    try_files $uri =404;
    autoindex off;
    add_header Cache-Control $stronghold_static_cache;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
}

location ~ ^/shared/(.+\.js)$ {
    alias /opt/sp2/shared/$1;
    add_header Cache-Control $stronghold_static_cache;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript;
}

location ~ ^/sim/(.+\.js)$ {
    alias /opt/sp2/server/sim/$1;
    add_header Cache-Control $stronghold_static_cache;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript;
}
