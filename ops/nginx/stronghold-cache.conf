# Install at /etc/nginx/conf.d/stronghold-cache.conf (http context).
# Match the Node static handler: HTML revalidates; ?v= is immutable;
# unversioned assets/fonts/vendor cache one day; code revalidates.
map "$uri?$args" $stronghold_static_cache {
    default "no-cache";
    ~\.html?\? "no-cache";
    ~\?(?:.*&)?v= "public, max-age=31536000, immutable";
    ~^/(?:assets|fonts|vendor)/ "public, max-age=86400";
}
