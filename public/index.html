<body>
  <style>
    #distribution-notice[hidden]{display:none}#distribution-notice{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
    #distribution-notice .notice-panel{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;background:#141b20;color:#eef2f5;border:1px solid #61747d;border-radius:14px;padding:24px;font:15px/1.7 system-ui,sans-serif;box-shadow:0 20px 80px #0008}
    #distribution-notice h2{font-size:21px;margin:0 0 14px}#distribution-notice p{margin:12px 0}#distribution-notice strong{color:#ffd08a}#distribution-notice button{display:block;width:100%;padding:12px;border:0;border-radius:8px;background:#f0bb6c;color:#17212a;font:600 16px system-ui;cursor:pointer;margin-top:12px}#distribution-reopen{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 42px);z-index:2147483646;padding:8px 16px;border:1px solid #f0bb6c;border-radius:8px;background:#141b20;color:#ffd08a;font:14px system-ui;cursor:pointer}
  </style>
  <section id="distribution-notice" hidden role="dialog" aria-modal="true" aria-labelledby="distribution-notice-title">
    <div class="notice-panel">
      <h2 id="distribution-notice-title">公告</h2>
      <p><strong>由于服务器带宽限制，网页版暂时关闭；带宽问题解决后会重新开放。</strong></p>
      <p>请加入 QQ 群 <strong id="distribution-group-number">1124360673</strong> 下载客户端，并在群内实时了解更新详情。</p>
      <p>客户端更新请使用客户端右上角的“检查更新”，更新器会自动下载并安装适用的小补丁。</p>
      <button type="button" onclick="copyDistributionGroup()">复制 QQ 群号 1124360673</button>
      <p id="distribution-copy-status" role="status" aria-live="polite"></p>
      <button type="button" data-notice-dismiss>我知道了</button>
    </div>
  </section>
  <!-- 「公告」按钮只在标题页渲染（js/main.js 按路由输出），否则它会跟着进对局 -->
  <script>
    async function copyDistributionGroup() {
      const group = '1124360673', status = document.getElementById('distribution-copy-status');
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(group);
        else {
          const field = document.createElement('textarea'); field.value = group; document.body.appendChild(field);
          field.select(); if (!document.execCommand('copy')) throw new Error('copy failed'); field.remove();
        }
        status.textContent = '群号已复制。';
      } catch (_) { status.textContent = '复制失败，请长按群号选择复制。'; }
    }
  </script>
  <div id="app"></div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__inner">
      <div class="boot__hex"></div>
      <div class="boot__text">STRONGHOLD PROTOCOL</div>
      <div id="boot-err" class="boot__err"></div>
    </div>
  </div>

  <div class="rotate-hint" role="alert">
    <div class="rotate-hint__phone"></div>
    <div class="rotate-hint__title">请将设备横屏</div>
    <div>卫戍协议：盟约 需要横屏显示以获得完整体验</div>
    <button type="button" hidden class="btn btn--secondary btn--sm rotate-hint__pwa" id="rotate-hint-pwa">添加到桌面</button>
    <div class="rotate-hint__micro">ROTATE DEVICE</div>
  </div>

  <noscript><p style="color:#c3cbc7;text-align:center;padding:40px">需要启用 JavaScript 才能运行本游戏。</p></noscript>
  <script>
    // Boot diagnostics (plain ES5: runs everywhere). A browser too old for the app says so instead of spinning forever:
    // no ES modules (nomodule below), a module graph that cannot load (e.g. import maps: Safari / iOS < 16.4), or no
    // boot after 9 s.
    window.__spBootFail = function (why) {
      var e = document.getElementById('boot-err');
      if (!e || e.getAttribute('data-final')) return;
      var im = false;
      try { im = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')); } catch (x) { im = false; }
      e.textContent = why === 'old' || !im
        ? '当前浏览器版本过旧，无法运行本游戏。请升级到 iOS / iPadOS 16.4+（Safari 16.4+）、Chrome / Edge 90+ 或 Firefox 108+ 后刷新。'
        : '游戏脚本加载失败，请检查网络连接后刷新页面。';
      e.setAttribute('data-final', '1');
    };
    // a module graph that fails to link (bare specifier without import-map support) reports here, not on the <script>
    window.addEventListener('error', function (ev) {
      var b = document.getElementById('boot');
      if (!b || b.classList.contains('is-done')) return;
      if (/specifier|resolve|import|module/i.test(String(ev && ev.message))) window.__spBootFail('load');
    });
  </script>
  <script type="module" src="/js/main.js" onerror="window.__spBootFail && window.__spBootFail('load')"></script>
  <script nomodule>window.__spBootFail && window.__spBootFail('old');</script>
  <script>
    // If modules never boot (very old browser / blocked script), explain instead of spinning forever.
    setTimeout(function () {
      var b = document.getElementById('boot'), e = document.getElementById('boot-err');
      if (b && !b.classList.contains('is-done') && e && !e.textContent) e.textContent = '加载时间较长…如长时间无响应，请使用最新版 Chrome / Edge / Safari / Firefox 并刷新页面。';
    }, 9000);
  </script>
